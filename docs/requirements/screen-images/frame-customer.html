<h1>共通フレーム（店頭）</h1>

<p class="note">店頭のすべての画面がこの枠を持つ。各画面は
<code>body-area</code> の中身だけを描く（<a href="README.md">書式</a>）。</p>

<h2>版面</h2>

<div class="frame">
  <div class="frame-header">
    <b>Bob's Used Books</b>
    <span><span class="cond">ログイン時</span> 注文</span>
    <span>探す</span>
    <span><span class="cond">ログイン時</span> 本を売る</span>
    <span>欲しい物</span>
    <span>かご</span>
    <span class="right">
      <span>利用者名</span>
      <span><span class="cond">管理者</span> 管理画面</span>
      <span>ログイン / ログアウト</span>
    </span>
  </div>
  <div class="frame-banner">
    <span class="cond">直前の操作が成功したとき</span> 通知バナー
  </div>
  <div class="body-area"></div>
  <div class="frame-footer">
    <div class="cards">
      <div class="card">
        <div><b>店の所在</b></div>
        <div class="note">住所</div>
        <div class="note">電話</div>
        <div class="note">メール</div>
      </div>
      <div class="card">
        <div><b>営業時間</b></div>
        <div class="note">平日</div>
        <div class="note">土曜</div>
        <div class="note">日曜</div>
      </div>
      <div class="card">
        <div><b>案内</b></div>
        <div><span class="link">トップ</span></div>
        <div><span class="link">プライバシー</span></div>
        <div><span class="link">注文</span></div>
        <div><span class="link">探す</span></div>
        <div><span class="link">かご</span></div>
      </div>
    </div>
    <hr>
    <div class="note">© 年 Bob's Used Books ｜ <span class="link">プライバシー</span></div>
  </div>
</div>
