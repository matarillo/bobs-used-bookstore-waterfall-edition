<main class="wrap">
<h1 class="pt">書籍の登録</h1>



<form aria-label="書籍">
<div class="form2">
<div class="stack">
<div class="fg"><label class="lbl" for="b-title">書名</label><input class="input" id="b-title" type="text" value=""></div>
<div class="fg"><label class="lbl" for="b-author">著者</label><input class="input" id="b-author" type="text" value=""></div>
<div class="fg"><label class="lbl" for="b-isbn">ISBN</label><input class="input" id="b-isbn" type="text" value="" style="max-width: 280px"></div>
<div class="pair">
<div class="fg">
<label class="lbl" for="b-price">売価（円）</label>
<input class="input" id="b-price" type="text" value="">
<p class="hint">税抜で入力します。店頭には税込で表示されます。</p>
</div>
<div class="fg">

<label class="lbl" for="b-cost">仕入原価（円）</label>
<input class="input" id="b-cost" type="text" value="">
<p class="hint">店がこの一冊に払った額。必須で、保存したあとは変えられません。</p>


</div>
</div>
<div class="fg">
<label class="lbl" for="b-qty">在庫数</label>
<div class="row" style="align-items: flex-start">
<input class="input input-short" id="b-qty" type="text" value="1">

</div>
</div>
<div class="fg"><label class="lbl" for="b-sum">概要</label><textarea class="textarea" id="b-sum" value=""></textarea></div>
<label class="check"><input type="checkbox">非公開にする（店頭の検索結果とトップに出さない）</label>
</div>

<div class="stack">
<div class="fg"><label class="lbl" for="b-pub">出版社</label><div class="withbtn"><select class="select" id="b-pub"><option>出版社を選ぶ</option><option>新潮社</option><option>岩波書店</option></select><button class="btn" type="button">追加</button></div></div>
<div class="fg"><label class="lbl" for="b-genre">ジャンル</label><div class="withbtn"><select class="select" id="b-genre"><option>ジャンルを選ぶ</option><option>海外文学</option><option>自然・科学</option></select><button class="btn" type="button">追加</button></div></div>
<div class="fg"><label class="lbl" for="b-type">書籍種別</label><div class="withbtn"><select class="select" id="b-type"><option>書籍種別を選ぶ</option><option>文庫</option><option>新書</option></select><button class="btn" type="button">追加</button></div></div>
<div class="fg"><label class="lbl" for="b-cond">コンディション</label><div class="withbtn"><select class="select" id="b-cond"><option>コンディションを選ぶ</option><option>ほぼ新品</option><option>非常に良い</option><option>可</option></select><button class="btn" type="button">追加</button></div></div>
</div>
</div>

<div class="cover-field">

<span class="thumb cover-none" aria-hidden="true"></span>
<div class="fg">
<label class="lbl" for="b-img">表紙画像</label>
<input class="file" id="b-img" type="file">
<p class="hint">画像がないときは、店の既定の表紙が表示されます。</p>

</div>
</div>

<div class="form-acts">
<button class="btn btn-primary" type="button">登録する</button>
<a class="btn" href="SCR-A-BOOKS.html">在庫一覧に戻る</a>
</div>
</form>
</main>
